# 离线服务栈只包含应用和网关，数据库由管理员在引导页配置。
services:
  app:
    image: ${LEAFDOC_IMAGE:?}
    pull_policy: never
    restart: unless-stopped
    # 可选邮件、代理认证和功能开关由私有运行配置传入，安装状态仍由持久记录决定。
    env_file:
      - /etc/leafdoc/application.env
    environment:
      LEAFDOC_HOST: 0.0.0.0
      LEAFDOC_WEB_SETUP: 'true'
      LEAFDOC_DATA_DIR: /app/data
      LEAFDOC_BASE_PATH: ${LEAFDOC_BASE_PATH:-}
    command: [--enable-revision, --snapshot]
    volumes:
      - /var/lib/leafdoc:/app/data
    stop_grace_period: 45s
  gateway:
    image: ${LEAFDOC_CADDY_IMAGE:?}
    pull_policy: never
    restart: unless-stopped
    ports:
      - '${LEAFDOC_FRONTEND_PORT}:${LEAFDOC_FRONTEND_PORT}'
      - '80:80'
      - '443:443'
    volumes:
      - /etc/leafdoc/Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/leafdoc/tls:/etc/caddy/tls:ro
      - gateway_data:/data
      - gateway_config:/config
volumes:
  gateway_data:
  gateway_config:
