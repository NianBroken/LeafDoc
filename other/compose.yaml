# Ubuntu 完整服务栈。端口、配置路径及密钥由部署入口提供，不携带本机资料。
services:
  database:
    image: ${LEAFDOC_MYSQL_IMAGE:?Run deploy.sh init first}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${LEAFDOC_MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${LEAFDOC_MYSQL_DATABASE:?}
      MYSQL_USER: ${LEAFDOC_MYSQL_USER:?}
      MYSQL_PASSWORD: ${LEAFDOC_MYSQL_PASSWORD:?}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=tcp -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" > /dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  app:
    image: ${LEAFDOC_IMAGE:-leafdoc:local}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      LEAFDOC_HOST: 0.0.0.0
      LEAFDOC_TLS_CERT: /run/leafdoc-tls/server.crt
      LEAFDOC_TLS_KEY: /run/leafdoc-tls/server.key
      LEAFDOC_MYSQL_HOST: database
      LEAFDOC_MYSQL_DATABASE: ${LEAFDOC_MYSQL_DATABASE:?}
      LEAFDOC_MYSQL_USER: ${LEAFDOC_MYSQL_USER:?}
      LEAFDOC_MYSQL_PASSWORD: ${LEAFDOC_MYSQL_PASSWORD:?}
      LEAFDOC_JWT_SECRET: ${LEAFDOC_JWT_SECRET:?}
      LEAFDOC_ADMIN_PASSWORD: ${LEAFDOC_ADMIN_PASSWORD:?}
      LEAFDOC_BASE_PATH: ${LEAFDOC_BASE_PATH:-}
      LEAFDOC_DATA_DIR: /app/data
    ports:
      - '${LEAFDOC_BIND_ADDRESS:-0.0.0.0}:${LEAFDOC_BACKEND_PORT}:${LEAFDOC_BACKEND_PORT}/tcp'
    command: [--enable-revision, --snapshot]
    volumes:
      - ${LEAFDOC_CONFIG_DIR:-/etc/leafdoc}/tls:/run/leafdoc-tls:ro
      - documents:/app/data
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- "http://127.0.0.1:${LEAFDOC_BACKEND_PORT}$${LEAFDOC_BASE_PATH}/api/health" > /dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 45s
    logging: *logging
  gateway:
    image: ${LEAFDOC_IMAGE:-leafdoc:local}
    restart: unless-stopped
    command: [gateway]
    environment:
      LEAFDOC_HOST: 0.0.0.0
      LEAFDOC_BASE_PATH: ${LEAFDOC_BASE_PATH:-}
      LEAFDOC_BACKEND_URL: http://app:${LEAFDOC_BACKEND_PORT}
      LEAFDOC_TLS_CERT: /run/leafdoc-tls/server.crt
      LEAFDOC_TLS_KEY: /run/leafdoc-tls/server.key
    depends_on:
      - app
    ports:
      - '${LEAFDOC_BIND_ADDRESS:-0.0.0.0}:${LEAFDOC_FRONTEND_PORT}:${LEAFDOC_FRONTEND_PORT}/tcp'
    volumes:
      - ${LEAFDOC_CONFIG_DIR:-/etc/leafdoc}/tls:/run/leafdoc-tls:ro
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- "http://127.0.0.1:${LEAFDOC_FRONTEND_PORT}$${LEAFDOC_BASE_PATH}/api/health" > /dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s
volumes:
  database:
  documents:
