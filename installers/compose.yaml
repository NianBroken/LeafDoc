# 应用使用独立 MySQL 服务。安装令牌和首次安装配置存放在命名卷中。
services:
  database:
    image: ${LEAFDOC_MYSQL_IMAGE:-mysql:8.0}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${LEAFDOC_MYSQL_ROOT_PASSWORD:?设置 LEAFDOC_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${LEAFDOC_MYSQL_DATABASE:-leafdoc}
      MYSQL_USER: ${LEAFDOC_MYSQL_USER:-leafdoc}
      MYSQL_PASSWORD: ${LEAFDOC_MYSQL_PASSWORD:?设置 LEAFDOC_MYSQL_PASSWORD}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=tcp -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  app:
    build:
      context: ..
      dockerfile: installers/Dockerfile
      args:
        APP_NAME: LeafDoc
        APP_VERSION: ${LEAFDOC_VERSION:-local}
    image: ${LEAFDOC_IMAGE:-leafdoc:local}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      LEAFDOC_HOST: 0.0.0.0
      LEAFDOC_WEB_SETUP: "true"
      LEAFDOC_DATA_DIR: /app/data
      LEAFDOC_BASE_PATH: ${LEAFDOC_BASE_PATH:-}
    command: [--port, "24692", --enable-revision, --snapshot]
    ports:
      - "${LEAFDOC_BIND_ADDRESS:-127.0.0.1}:${LEAFDOC_PORT:-24692}:24692"
    volumes:
      - application-data:/app/data
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- "http://127.0.0.1:24692$${LEAFDOC_BASE_PATH}/api/health" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 45s
    logging: *logging
volumes:
  database:
  application-data:
