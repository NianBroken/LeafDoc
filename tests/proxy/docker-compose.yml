# This stack only connects to its private MySQL container and ephemeral test schemas.
name: leafdoc-proxy-${E2E_PROXY_RUN_ID:?Run tests/proxy/run.mjs}
x-mysql: &mysql
  LEAFDOC_MYSQL_HOST: mysql
  LEAFDOC_MYSQL_PORT: ${E2E_MYSQL_PORT:?Load shared ports.json with run.mjs}
  LEAFDOC_MYSQL_USER: root
  LEAFDOC_MYSQL_PASSWORD: ${E2E_MYSQL_PASSWORD:?Use run.mjs}
  LEAFDOC_PORT: ${E2E_BACKEND_PORT:?Load shared ports.json with run.mjs}

services:
  # Default config: reverse-proxy auth enabled, auto-create OFF (the documented
  # default). Exercises the original "unknown proxy-asserted user is rejected"
  # behavior end-to-end through the real CLI-flag -> router -> middleware wiring.
  leafdoc:
    environment:
      <<: *mysql
      LEAFDOC_MYSQL_DATABASE: ${E2E_DATABASE:?Use run.mjs}
    depends_on:
      mysql:
        condition: service_healthy
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        RATE_LIMIT_BYPASS: "true"
    command:
      - "--jwt-secret=${E2E_JWT_SECRET:?Use run.mjs}"
      - "--admin-password=adminproxypassword"
      - "--allow-insecure=true"
      - "--enable-http-remote-user=true"
      # Trust the entire proxy-net subnet so nginx can forward headers.
      - "--trusted-proxy-ips=172.30.0.0/16"
    networks:
      proxy-net:
        ipv4_address: 172.30.0.2
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${E2E_BACKEND_PORT:?Use run.mjs}/api/config"]
      interval: 2s
      timeout: 5s
      retries: 30

  nginx:
    environment:
      E2E_BACKEND_PORT: ${E2E_BACKEND_PORT:?Use run.mjs}
      E2E_LISTEN_PORT: ${E2E_PROXY_PORT:?Use run.mjs}
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:${E2E_PROXY_PORT:?Use run.mjs}:${E2E_PROXY_PORT:?Use run.mjs}"
    depends_on:
      leafdoc:
        condition: service_healthy
    networks:
      proxy-net:
        ipv4_address: 172.30.0.3

  # Auto-create config: same as above but with --enable-http-remote-user-auto-create
  # and the email header set, for tests specific to that feature. Kept as a
  # separate stack (rather than flipping the default one) so the default's
  # "unknown user -> 401" behavior stays covered end-to-end too.
  leafdoc-autocreate:
    environment:
      <<: *mysql
      LEAFDOC_MYSQL_DATABASE: ${E2E_AUTOCREATE_DATABASE:?Use run.mjs}
    depends_on:
      mysql:
        condition: service_healthy
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        RATE_LIMIT_BYPASS: "true"
    command:
      - "--jwt-secret=${E2E_JWT_SECRET:?Use run.mjs}"
      - "--admin-password=adminproxypassword"
      - "--allow-insecure=true"
      - "--enable-http-remote-user=true"
      - "--trusted-proxy-ips=172.30.0.0/16"
      - "--enable-http-remote-user-auto-create=true"
      - "--http-remote-user-email-header-name=Remote-Email"
      - "--http-remote-user-default-role=viewer"
    networks:
      proxy-net:
        ipv4_address: 172.30.0.4
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${E2E_BACKEND_PORT:?Use run.mjs}/api/config"]
      interval: 2s
      timeout: 5s
      retries: 30

  nginx-autocreate:
    environment:
      E2E_BACKEND_PORT: ${E2E_BACKEND_PORT:?Use run.mjs}
      E2E_LISTEN_PORT: ${E2E_AUTOCREATE_PROXY_PORT:?Use run.mjs}
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx-autocreate.conf:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:${E2E_AUTOCREATE_PROXY_PORT:?Use run.mjs}:${E2E_AUTOCREATE_PROXY_PORT:?Use run.mjs}"
    depends_on:
      leafdoc-autocreate:
        condition: service_healthy
    networks:
      proxy-net:
        ipv4_address: 172.30.0.5

  mysql:
    image: mysql:8.4
    command: ["--port=${E2E_MYSQL_PORT:?Use run.mjs}", "--ngram-token-size=2"]
    environment:
      MYSQL_ROOT_PASSWORD: ${E2E_MYSQL_PASSWORD:?Use run.mjs}
      MYSQL_ROOT_HOST: "%"
      E2E_MYSQL_PORT: ${E2E_MYSQL_PORT:?Use run.mjs}
      E2E_DATABASE: ${E2E_DATABASE:?Use run.mjs}
      E2E_AUTOCREATE_DATABASE: ${E2E_AUTOCREATE_DATABASE:?Use run.mjs}
    volumes:
      - ./mysql-init.sh:/docker-entrypoint-initdb.d/10-test-databases.sh:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin --protocol=tcp -h127.0.0.1 -P"$$E2E_MYSQL_PORT" -uroot ping --silent']
      interval: 2s
      timeout: 5s
      retries: 60
    networks:
      proxy-net:
        ipv4_address: 172.30.0.6

networks:
  proxy-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
